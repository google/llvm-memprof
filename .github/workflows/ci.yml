name: llvm-memprof CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
 build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build and Unit Tests
      shell: bash
      run: |
        set -euo pipefail
        ./init.sh
        source env.sh
        bazel --version
    - name: DwarfMetadata Fetcher Test
      run: |
        bazel run --cxxopt="-std=c++20" --crosstool_top=//toolchain:clang_suite //src:dwarf_metadata_fetcher_test
  
    - name: Type Resolver Test
      run: |
        bazel run --cxxopt="-std=c++20" --crosstool_top=//toolchain:clang_suite //src:type_resolver_test
   
    - name: Histogram Builder Test
      run: |
        bazel run --cxxopt="-std=c++20" --crosstool_top=//toolchain:clang_suite //src:histogram_builder_test